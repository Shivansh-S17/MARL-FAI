[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pursuit"
version = "0.1.0"
description = "Opponent learning vs limited communication in cooperative pursuit"
requires-python = ">=3.12"
dependencies = ["numpy", "torch", "gymnasium", "pettingzoo", "pyyaml", "pandas", "matplotlib", "pillow", "pygame", "pytest", "tensorboard"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
