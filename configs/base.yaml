env:
  map: corridor
  n_npcs: 4
  horizon: 200
  radius: 5
  player_radius: 5
  spawn: standard       # standard | split
  delay: 0
  budget: "1/8"
  min_start_dist: 4
reward:
  capture: 1.0
  step: 0.10
  comm: 0.01
  move: 0.02
  shaping: false
  shaping_coef: 0.10
player:
  type: waypoint        # waypoint | qlearning
  xi: 0.0
q:
  epsilon: 0.10
  alpha: 0.10
  gamma: 0.95
ppo:
  lr: 3.0e-4
  clip: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  gamma: 1.0
  gae_lambda: 0.95
  n_envs: 8
  rollout_len: 128
  epochs: 4
  seq_len: 16
  minibatches: 4
predictor:
  hidden: 32
  lr: 1.0e-3
  buffer: 512
  updates_per_rollout: 5
  batch: 64
  min_labels: 16
  online_every: 20
train:
  total_steps: 300000
  curriculum: [[0, 30000, 1, 3], [30000, 90000, 4, 8]]
  checkpoint_every: 50000
  device: cpu
seed: 0
